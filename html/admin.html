<!--
  Standalone Admin-Panel-Variante (für Headless-Tests im Browser).
  Lädt die gleichen Module wie index.html, aber direkt im Admin-View.
-->
<!doctype html>
<html lang="de"><head>
  <meta charset="utf-8"/>
  <title>clp_hds admin</title>
  <link rel="stylesheet" href="css/common.css"/>
  <link rel="stylesheet" href="css/glass.css"/>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body class="solo-admin">
  <div id="adminPanel" class="panel">
    <div class="glass admin-shell">
      <aside class="admin-side">
        <div class="brand"><span class="dot"></span><strong>clp_hds Admin</strong><small id="adminVersion">v0.0</small></div>
        <nav id="adminNav">
          <button data-tab="items">Items</button>
          <button data-tab="recipes">Rezepte</button>
          <button data-tab="drugs">Drogen</button>
          <button data-tab="minigames">Minigames</button>
          <button data-tab="labs">Labore</button>
          <button data-tab="shells">Shells / MLOs</button>
          <button data-tab="players">Spieler</button>
          <button data-tab="police">Heat / Polizei</button>
          <button data-tab="zones">Sammelzonen</button>
          <button data-tab="logs">Logs</button>
          <button data-tab="settings">Settings</button>
        </nav>
      </aside>
      <main id="adminMain" class="admin-main"></main>
    </div>
  </div>
  <script src="js/core.js"></script>
  <script src="js/admin/app.js"></script>
  <script src="js/admin/items.js"></script>
  <script src="js/admin/recipes.js"></script>
  <script src="js/admin/drugs.js"></script>
  <script src="js/admin/minigames.js"></script>
  <script src="js/admin/labs.js"></script>
  <script src="js/admin/shells.js"></script>
  <script src="js/admin/players.js"></script>
  <script src="js/admin/police.js"></script>
  <script src="js/admin/zones.js"></script>
  <script src="js/admin/logs.js"></script>
  <script src="js/admin/settings.js"></script>
</body></html>
